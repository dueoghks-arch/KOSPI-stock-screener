name: KOSPI 200 Stock Screener

on:
  schedule:
    - cron: '11 02 * * 1-5' # 월~금 한국 시간 오전 8시 00분 자동 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  screen_and_email:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas lxml requests finance-datareader

    - name: Run Screener Script
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python main.py
